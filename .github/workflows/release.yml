name: Release

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet publish SNExtractor.csproj -c Release -r win-x64 --self-contained false -o out

      - uses: azure/login@v2
        with:
          allow-no-subscriptions: true
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: haucke-labs
          certificate-profile-name: Personal
          files-folder: out
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - run: Compress-Archive -Path out/* -DestinationPath SNE-${{ github.ref_name }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: SNE-${{ github.ref_name }}.zip
